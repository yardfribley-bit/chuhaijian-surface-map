[project]
name = "chuhaijian-surface-map"
version = "0.2.0"
description = "出海鉴 · 授权目标非侵入攻击面测绘 / FOFA 挂图作战（无利用）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.scripts]
surfacemap = "surfacemap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
